# Review-only until the owner approves and pushes this workflow to ovh/main.
name: OVH Sync images

on:
  push:
    branches: ['ovh/main']
  pull_request:
    branches: ['ovh/main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-sync-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Restore and test the Orchestrator and bundled Worker
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/SingleContainer/Worker/NetworkPerspective.Sync.Worker.Tests/NetworkPerspective.Sync.Worker.Tests.csproj
            src/SingleContainer/Orchestrator/NetworkPerspective.Sync.Orchestrator.Tests/NetworkPerspective.Sync.Orchestrator.Tests.csproj
            src/SingleContainer/Orchestrator/NetworkPerspective.Sync.Orchestrator.Application.Tests/NetworkPerspective.Sync.Orchestrator.Application.Tests.csproj
            src/SingleContainer/Orchestrator/NetworkPerspective.Sync.Orchestrator.Persistence.Tests/NetworkPerspective.Sync.Orchestrator.Persistence.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project" --source https://api.nuget.org/v3/index.json \
              -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate -p:TreatWarningsAsErrors=true
            dotnet test "$project" --no-restore --configuration Release --filter 'SkipInCi!=true'
          done
      - name: Explicit local PostgreSQL 18 compatibility test
        shell: bash
        env:
          SYNC_OVH_LOCAL_POSTGRES: 'true'
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock pull postgres:18
          dotnet test src/SingleContainer/Orchestrator/NetworkPerspective.Sync.Orchestrator.Persistence.Tests/NetworkPerspective.Sync.Orchestrator.Persistence.Tests.csproj \
            --no-build --no-restore --configuration Release --filter 'FullyQualifiedName~PostgreSqlLocalIntegrationTests'

  publish:
    needs: test
    if: github.ref == 'refs/heads/ovh/main' && github.event_name != 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ovh-publish
    env:
      OVH_REGISTRY_HOST: ${{ vars.OVH_REGISTRY_HOST }}
      OVH_REGISTRY_PROJECT: ${{ vars.OVH_REGISTRY_PROJECT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate destination and source before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          host = os.environ['OVH_REGISTRY_HOST']
          project = os.environ['OVH_REGISTRY_PROJECT']
          label = r'[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          if len(host) > 253 or not re.fullmatch(rf'{label}(?:\.{label})+', host):
              raise SystemExit('OVH_REGISTRY_HOST must be a bare lowercase DNS hostname, without scheme, port or path')
          if not re.fullmatch(r'[a-z0-9]+(?:[._-][a-z0-9]+)*', project) or len(project) > 128:
              raise SystemExit('OVH_REGISTRY_PROJECT must be one lowercase registry project name')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA']):
              raise SystemExit('Invalid source SHA')
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker buildx version
      - name: Log in with the scoped OVH robot
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ovh-docker-config
          OVH_REGISTRY_USERNAME: ${{ secrets.OVH_REGISTRY_USERNAME }}
          OVH_REGISTRY_PASSWORD: ${{ secrets.OVH_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OVH_REGISTRY_USERNAME" && test -n "$OVH_REGISTRY_PASSWORD"
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$OVH_REGISTRY_PASSWORD" | docker login "$OVH_REGISTRY_HOST" \
            --username "$OVH_REGISTRY_USERNAME" --password-stdin
      - name: Build and push only the two OVH runtime images
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ovh-docker-config
        run: |
          set -euo pipefail
          mkdir -p receipts
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for image in orchestrator sync-worker; do
            if [ "$image" = orchestrator ]; then
              dockerfile=src/Orchestrator.Dockerfile
              build_args=()
            else
              dockerfile=src/Worker.Dockerfile
              build_args=(--build-arg "VERSION=1.0.0-ovh.${GITHUB_RUN_NUMBER}+${GITHUB_SHA}")
            fi
            repository="$OVH_REGISTRY_HOST/$OVH_REGISTRY_PROJECT/$image"
            docker buildx build --platform linux/amd64 --pull --push \
              --file "$dockerfile" --tag "$repository:$tag" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --metadata-file "$RUNNER_TEMP/$image-metadata.json" "${build_args[@]}" src
            python3 - "$repository" "$RUNNER_TEMP/$image-metadata.json" "receipts/$image.json" <<'PY'
          import json, os, re, sys
          repository, metadata_path, receipt_path = sys.argv[1:]
          with open(metadata_path) as stream:
              digest = json.load(stream).get('containerimage.digest', '')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Missing immutable image digest from buildx')
          receipt = {'repository': repository, 'digest': digest, 'sourceSHA': os.environ['GITHUB_SHA']}
          with open(receipt_path, 'w') as stream:
              json.dump(receipt, stream, indent=2)
              stream.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"`{repository}@{digest}` — source `{receipt['sourceSHA']}`\n\n")
          PY
          done
      - name: Save immutable digest receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovh-sync-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove registry credentials
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ovh-docker-config
        run: |
          if [ -d "$DOCKER_CONFIG" ]; then
            docker logout "$OVH_REGISTRY_HOST" || true
            rm -rf -- "$DOCKER_CONFIG"
          fi
